name: Julia CI

on:
  push:
    paths:
      - 'julia/**'
      - '.github/workflows/julia-ci.yml'
  pull_request:
    paths:
      - 'julia/**'
      - '.github/workflows/julia-ci.yml'

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Guard against a known regression (FaradayDisk committed into scripts/Project.toml)
        run: |
          if grep -q '^FaradayDisk = ' julia/scripts/Project.toml; then
            echo "::error file=julia/scripts/Project.toml::FaradayDisk must never be committed as a [deps] entry here -- it's added at runtime by Pkg.develop() (see _bootstrap.jl) and has no matching Manifest.toml on a fresh clone, which broke a real cluster run with 'expected package FaradayDisk to be registered'. Remove this line before committing (see the file's own header comment)."
            exit 1
          fi

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2
        with:
          cache-registries: "true"

      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: julia

      - uses: julia-actions/julia-runtest@v1
        with:
          project: julia
          annotate: true
        env:
          JULIA_NUM_THREADS: '2'
