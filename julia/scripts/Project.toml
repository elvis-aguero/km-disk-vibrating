# No [name]/[uuid] here: this environment is only ever used via `--project=julia/scripts`
# / Pkg.activate, never `using FaradayDiskScripts` — giving it one made Pkg treat it as an
# installable package requiring its own src/<Name>.jl entry point, which broke
# Pkg.develop(path="..") for the real dependency below (FaradayDisk) with "expected the
# file src/FaradayDiskScripts.jl to exist" (confirmed on a real cluster run, then
# reproduced and fixed locally once Julia became installable in this environment).

[deps]
CairoMakie = "13f3f980-e62b-5c42-98c6-ff1f3baf88f0"
JLD2 = "033835bb-8acc-5ee8-8aae-3f567f8a3819"
MAT = "23992714-dd62-5051-b70f-ba57cb901cac"
TOML = "fa267f1f-6049-4f14-aa54-33bafae1ed76"

[compat]
MAT = "0.10"
julia = "1.10"

# CairoMakie (run_validation_overlay.jl, run_matlab_baseline_check.jl) is a pure
# rasterizing/vector backend and works headlessly, so it's a normal dependency here and
# IS covered by a CI test (see julia/test/integration/test_plotting.jl).
#
# GLMakie (scripts/live_plot.jl only) is deliberately NOT listed here — it needs a real
# OpenGL/GLFW-capable display to precompile, which most headless CI/cluster nodes don't
# have. Since every script in this directory bootstraps by activating this environment
# and instantiating it, putting GLMakie here would risk failing migrate_dtn_caches.jl /
# run_matlab_baseline_check.jl / run_sweep.jl on machines that never touch it. It instead
# lives in its own environment, `live/Project.toml` — see live_plot.jl's own bootstrap.
#
# FaradayDisk is NOT listed in [deps] here, and must NEVER be committed as one: each
# script bootstraps it itself, at runtime, via `Pkg.develop(path="..")` on first use (see
# `_bootstrap.jl`), which adds a [deps] entry AND a matching Manifest.toml dev-path record
# together, atomically, on that machine. Committing a [deps] entry without the
# (gitignored, machine-specific) Manifest.toml that explains how to resolve it is exactly
# what broke a real cluster run: Pkg saw a FaradayDisk dependency with no path/manifest
# information behind it and tried to look it up in the public registry, where it will
# never exist ("expected package `FaradayDisk` to be registered").
#
# This has already recurred twice from ordinary local/cluster `Pkg.develop` usage getting
# swept into an unrelated commit (e.g. `git commit -a`) — if you ever see FaradayDisk back
# in this file, it means someone's local Pkg session rewrote it; just delete that line
# before committing. CI now also fails fast on this exact regression (see
# .github/workflows/julia-ci.yml's "Guard against a known regression" step) so it can't
# silently reach a real cluster run a third time.
#
# A `[sources]` entry would let FaradayDisk be declared as a path dependency here
# permanently, with no runtime Pkg.develop() step needed at all — but needs a newer Pkg
# than this project's julia="1.10" compat floor guarantees.
